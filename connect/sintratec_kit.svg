  <!-- Schrauben oben -->
  <use href="#screw" x="164" y="96"/><use href="#screw" x="500" y="92"/><use href="#screw" x="846" y="96"/>
  <use href="#screw" x="168" y="304"/><use href="#screw" x="500" y="306"/><use href="#screw" x="838" y="304"/>
  </g>
</svg>
