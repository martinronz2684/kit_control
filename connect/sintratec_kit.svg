  <rect x="112" y="64" width="776" height="274" rx="4" fill="url(#alu)"/>
  <rect x="108" y="58" width="784" height="12" rx="3" fill="#d0d4d8"/>
  <path d="M112 338 H888" stroke="#7f8388" stroke-width="3"/>
