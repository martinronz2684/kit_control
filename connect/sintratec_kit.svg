  <rect x="400" y="121" width="16" height="116" rx="4" fill="#161a20"/>
  <rect x="403" y="125" width="10" height="10" rx="3" fill="#2fa6cc"/>
  <rect x="403" y="146" width="10" height="7" rx="2" fill="#2fa6cc" opacity=".9"/>
  <g fill="#5d646e"><rect x="404" y="166" width="8" height="4" rx="1"/><rect x="404" y="182" width="8" height="4" rx="1"/><rect x="404" y="198" width="8" height="4" rx="1"/><rect x="404" y="226" width="8" height="4" rx="1"/></g>
  <rect x="421" y="122" width="40" height="5" rx="2" fill="#e9edf1"/>
  <rect x="490" y="122" width="38" height="5" rx="2.5" fill="#d0483e"/>
  <rect x="532" y="122" width="36" height="5" rx="2.5" fill="#3a4049"/><rect x="572" y="122" width="38" height="5" rx="2.5" fill="#3a4049"/>
  <rect x="421" y="132" width="110" height="96" rx="4" fill="#12161b" stroke="#262c34" stroke-width="1"/>
  <rect x="438" y="168" width="40" height="38" fill="none" stroke="#7f8b96" stroke-width="1.2"/>
  <rect x="480" y="168" width="36" height="38" fill="none" stroke="#7f8b96" stroke-width="1.2"/>
  <rect x="443" y="182" width="12" height="9" rx="1" fill="#2fa6cc"/><rect x="458" y="186" width="14" height="8" rx="1" fill="#2fa6cc"/>
  <rect x="446" y="150" width="14" height="10" rx="2" fill="#e8a24a" opacity=".8"/><rect x="466" y="150" width="14" height="10" rx="2" fill="#e8a24a" opacity=".8"/>
  <rect x="426" y="221" width="100" height="3" rx="1.5" fill="#2a3038"/><rect x="426" y="221" width="34" height="3" rx="1.5" fill="#2fa6cc"/>
  <rect x="536" y="132" width="36" height="28" rx="4" fill="#1a1f26"/><rect x="576" y="132" width="34" height="28" rx="4" fill="#1a1f26"/>
  <rect x="540" y="141" width="22" height="7" rx="2" fill="#ff8a5c"/><rect x="580" y="141" width="22" height="7" rx="2" fill="#e9edf1"/>
  <rect x="536" y="164" width="74" height="38" rx="4" fill="#1a1f26"/>
  <rect x="541" y="168" width="28" height="30" rx="2" fill="none" stroke="#7f8b96" stroke-width="1"/>
  <rect x="574" y="170" width="20" height="5" rx="2" fill="#e9edf1"/>
  <rect x="536" y="207" width="74" height="10" rx="5" fill="#5f6fb4"/>
  <rect x="536" y="221" width="74" height="10" rx="5" fill="#c94456"/>
  <!-- Taster links -->
  <circle cx="196" cy="200" r="21" fill="#8c9095"/><circle cx="196" cy="200" r="16" fill="url(#btn)"/><circle cx="196" cy="200" r="9" fill="none" stroke="#c4c8cc" stroke-width="2"/>
  <circle cx="282" cy="200" r="21" fill="#8c9095"/><circle cx="282" cy="200" r="16" fill="url(#btn)"/><circle cx="282" cy="200" r="9" fill="none" stroke="#c4c8cc" stroke-width="2"/>
  <!-- Taster rechts und Schlüsselschalter -->
  <circle cx="722" cy="186" r="21" fill="#8c9095"/><circle cx="722" cy="186" r="16" fill="url(#btn)"/><circle cx="722" cy="186" r="9" fill="none" stroke="#c4c8cc" stroke-width="2"/>
  <circle cx="808" cy="180" r="24" fill="#7b7f84"/><circle cx="808" cy="180" r="18" fill="url(#btn)"/>
  <rect x="804" y="166" width="8" height="28" rx="2" fill="#2a2b2d"/>
  <rect x="801" y="150" width="14" height="30" rx="5" fill="#141516"/>
  <circle cx="806" cy="206" r="9" fill="none" stroke="#9aa0a6" stroke-width="3"/>
  <path d="M800 214 L792 262 L800 266 L806 248 L802 246 L807 232 Z" fill="#b8bcc1" stroke="#7d8186" stroke-width="1.5"/>
  <path d="M813 212 L826 232 L816 274 L824 276 L834 236 Z" fill="#141516"/>
  <!-- Warnzeichen Strom -->
  <g transform="translate(742 112) scale(1.45)">
    <path d="M0 -26 L26 20 H-26 Z" fill="#f2c200" stroke="#1b1b1b" stroke-width="2.6" stroke-linejoin="round"/>
    <path d="M3 -14 L-6 3 H1 L-4 15 L8 -3 H1 Z" fill="#1b1b1b"/>
