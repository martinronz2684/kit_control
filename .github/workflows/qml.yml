name: Oberfläche prüfen

on:
  push:
    branches: [main]
    paths: ["app/**", "branding/**", "kitd/**", "tools/qml-check.sh", "tools/kit-shots.py", ".github/workflows/qml.yml"]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: write

jobs:
  qml:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Qt 6 QML installieren
        run: |
          sudo apt-get update
          sudo apt-get install -y qml-qt6 qml6-module-qtquick qml6-module-qtquick-window qml6-module-qtqml-workerscript qt6-qpa-plugins fonts-inter
      - name: Oberfläche laden
        run: sh tools/qml-check.sh
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Bildschirmfotos der Kit-Oberfläche
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          pip install -q "PySide6>=6.6" numpy
          timeout 240 python tools/kit-shots.py kitshots || true
      - name: Fotos als Artefakt (auch für Zweige)
        uses: actions/upload-artifact@v4
        with:
          name: kitshots
          path: kitshots
          if-no-files-found: ignore
      - name: Fotos ablegen (Branch kit-screens)
        if: github.ref == 'refs/heads/main'
        run: |
          cd kitshots || exit 0
          git init -q -b kit-screens
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A && git commit -q -m "Kit-Oberfläche ${GITHUB_SHA::7}" || exit 0
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" kit-screens:kit-screens
